aid: gate-bioscience
name: Gate Bioscience
description: >-
  Gate Bioscience is a preclinical biotechnology company founded in 2021 and headquartered in
  Brisbane, California, creating a new class of small-molecule medicines called Molecular Gates.
  Molecular Gates selectively eliminate disease-causing extracellular proteins at their origin
  inside the cell by binding the secretory translocon, the channel through which proteins exit the
  cell, so targeted proteins are degraded rather than secreted. The company's proprietary Molecular
  Gate Discovery Platform pairs a privileged library of molecules with bespoke secretion-focused
  assays and deep secretory-pathway biology to pursue more than 1,000 diseases linked to
  extracellular proteins. Gate Bioscience is backed by Andreessen Horowitz (a16z) Bio + Health, GV,
  Versant Ventures, ARCH Venture Partners, Forbion and Eli Lilly, and has raised roughly $134M
  across Series A and an oversubscribed $65M Series B. As a therapeutics company it publishes no
  public developer API, portal, or documentation; this profile is an API Evangelist network company
  record maintained for the portfolio graph.
